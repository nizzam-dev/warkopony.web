services:
  postgres:
    image: postgres:17
    container_name: warkopony-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DATABASE}
    ports:
      - "5432:5432"
    volumes:
      - warkopony_postgres_data:/var/lib/postgresql/data

volumes:
  warkopony_postgres_data: